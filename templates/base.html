<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Attendance App</title>

    <!-- PWA Settings -->
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <meta name="theme-color" content="#1e293b">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='icon.svg') }}">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 16px;
        }

        .app-container {
            width: 100%;
            max-width: 440px;
            background: #1e293b;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
            padding: 24px 20px;
            border: 1px solid #334155;
            margin-top: 10px;
            margin-bottom: 20px;
        }

        /* Flash Messages Banner */
        .flash-messages {
            margin-bottom: 16px;
        }

        .flash-alert {
            background-color: rgba(99, 102, 241, 0.15);
            border: 1px solid #6366f1;
            color: #818cf8;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
            text-align: center;
        }

        .profile-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 16px;
            border-bottom: 1px solid #334155;
            margin-bottom: 20px;
        }

        .user-info h2 {
            font-size: 20px;
            color: #ffffff;
            font-weight: 700;
        }

        .user-info p {
            font-size: 13px;
            color: #818cf8;
            font-weight: 600;
        }

        .btn-logout {
            padding: 8px 14px;
            background-color: #ef4444;
            color: #ffffff;
            text-decoration: none;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 700;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: #0f172a;
            border-radius: 16px;
            padding: 16px;
            border: 1px solid #334155;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .stat-card.primary { border-left: 4px solid #6366f1; }
        .stat-card.success { border-left: 4px solid #10b981; }
        .stat-card.warning { border-left: 4px solid #f59e0b; }
        .stat-card.danger  { border-left: 4px solid #ef4444; }

        .stat-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #94a3b8;
            font-weight: 700;
        }

        .stat-value {
            font-size: 22px;
            font-weight: 800;
            color: #ffffff;
            margin-top: 6px;
        }

        .progress-section {
            background: #0f172a;
            border-radius: 16px;
            padding: 16px;
            border: 1px solid #334155;
            margin-bottom: 24px;
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .progress-bar-bg {
            width: 100%;
            height: 12px;
            background: #1e293b;
            border-radius: 8px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            border-radius: 8px;
            transition: width 0.4s ease;
        }

        .card-section {
            background: #0f172a;
            border-radius: 16px;
            padding: 18px;
            border: 1px solid #334155;
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 15px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 14px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 4px;
            color: #cbd5e1;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 10px 12px;
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            font-size: 14px;
            color: #ffffff;
            outline: none;
        }

        .form-group input:focus, .form-group select:focus {
            border-color: #6366f1;
        }

        .btn-action {
            width: 100%;
            padding: 12px;
            background-color: #6366f1;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 6px;
        }

        .log-btn-group {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .btn-log-present {
            flex: 1;
            padding: 8px;
            background-color: #10b981;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-log-absent {
            flex: 1;
            padding: 8px;
            background-color: #ef4444;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-delete {
            background: none;
            border: none;
            color: #64748b;
            font-size: 12px;
            cursor: pointer;
            padding: 2px 6px;
        }

        .btn-delete:hover {
            color: #ef4444;
        }

        .badge {
            font-size: 10px;
            font-weight: 800;
            padding: 3px 8px;
            border-radius: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: inline-block;
        }

        .badge-safe {
            background-color: rgba(16, 185, 129, 0.15);
            color: #10b981;
            border: 1px solid #10b981;
        }

        .badge-danger {
            background-color: rgba(239, 68, 68, 0.15);
            color: #ef4444;
            border: 1px solid #ef4444;
        }

        .warning-box {
            background-color: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 8px;
            padding: 8px 10px;
            margin-top: 10px;
            font-size: 12px;
            color: #fca5a5;
        }

        /* Dynamic status styling helpers */
        .border-at-risk { border: 1px solid #ef4444 !important; }
        .border-safe { border: 1px solid #334155 !important; }

        .text-safe { color: #10b981; }
        .text-danger { color: #ef4444; }

        .bg-safe { background: linear-gradient(90deg, #6366f1, #10b981); }
        .bg-danger { background: #ef4444; }
    </style>

    <!-- Service Worker Script -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register("{{ url_for('static', filename='sw.js') }}")
                    .then(reg => console.log('Service Worker registered successfully!'))
                    .catch(err => console.log('Service Worker registration failed:', err));
            });
        }
    </script>
</head>
<body>
    <div class="app-container">
        <!-- Flash Alert Messages -->
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="flash-messages">
                    {% for message in messages %}
                        <div class="flash-alert">{{ message }}</div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </div>
</body>
</html>
