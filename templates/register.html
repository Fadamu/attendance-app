{% extends "base.html" %}

{% block content %}
<div class="auth-header">
    <h2>Create Account</h2>
    <p>Register your student profile</p>
</div>

{% with messages = get_flashed_messages() %}
  {% if messages %}
    {% for message in messages %}
      <div class="alert">{{ message }}</div>
    {% endfor %}
  {% endif %}
{% endwith %}

<form action="{{ url_for('register') }}" method="POST">
    <div class="form-group">
        <label for="username">Full Name / Username</label>
        <input type="text" id="username" name="username" required placeholder="John Doe">
    </div>

    <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" required placeholder="student@example.com">
    </div>

    <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required placeholder="Create a strong password">
    </div>

    <button type="submit" class="btn-primary">Sign Up</button>
</form>

<div class="auth-footer">
    <p>Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
</div>
{% endblock %}
